name: Daily YouTube Short

on:
  schedule:
    # Temporarily enabled for 3 days. Scheduled runs after this window skip upload.
    - cron: "0 10 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel preset (general_stories, facts, school_story, etc.)"
        required: true
        default: "general_stories"
      topic:
        description: "Optional topic hint"
        required: false
        default: ""

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  DEAPI_TOKEN: ${{ secrets.DEAPI_TOKEN }}
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET_VALUE: ${{ secrets.YT_CLIENT_SECRET_VALUE }}
  YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
  DEAPI_TTS_MODEL: "Kokoro"
  DEAPI_TTS_VOICE: "am_michael"

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check temporary upload window
        id: upload_window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          expires_at="2026-06-26 18:30:00 UTC"
          now="$(date -u +%s)"
          expires="$(date -u -d "$expires_at" +%s)"

          if [ "$now" -lt "$expires" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "Scheduled upload window ended at $expires_at. Skipping."
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.upload_window.outputs.active == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.upload_window.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ffmpeg
        if: steps.upload_window.outputs.active == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        if: steps.upload_window.outputs.active == 'true'
        run: pip install -r requirements.txt

      # Restore story history from previous runs (prevents repeats)
      - name: Restore history cache
        if: steps.upload_window.outputs.active == 'true'
        uses: actions/cache/restore@v4
        with:
          path: output/history/
          key: story-history-${{ github.event.inputs.channel || 'general_stories' }}-${{ github.run_id }}
          restore-keys: |
            story-history-${{ github.event.inputs.channel || 'general_stories' }}-

      - name: Generate & upload Short
        if: steps.upload_window.outputs.active == 'true'
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'general_stories' }}"
          TOPIC="${{ github.event.inputs.topic || '' }}"

          if [ -n "$TOPIC" ]; then
            python scripts/run_short.py --channel "$CHANNEL" --topic "$TOPIC" --upload --privacy public
          else
            python scripts/run_short.py --channel "$CHANNEL" --upload --privacy public
          fi

      # Save history so next run knows what stories already exist
      - name: Save history cache
        uses: actions/cache/save@v4
        if: always() && steps.upload_window.outputs.active == 'true'
        with:
          path: output/history/
          key: story-history-${{ github.event.inputs.channel || 'general_stories' }}-${{ github.run_id }}
